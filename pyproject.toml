[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-research-assistant"
version = "0.9.0"
description = "A manual-first RAG research assistant, built one component at a time."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langchain-core>=1.6,<2.0",
    "langchain-ollama>=1.1,<2.0",
    "langgraph>=1.2,<2.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.10,<3.0",
    "pypdf>=5.0,<7.0",
    "qdrant-client>=1.19,<2.0",
    "sentence-transformers>=6.0,<7.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.0,<9.0",
]

[project.scripts]
rag-research-assistant = "rag_research_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
