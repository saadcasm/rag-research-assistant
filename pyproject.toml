[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-research-assistant"
version = "0.1.0"
description = "A framework-free RAG research assistant, built one component at a time."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
rag-research-assistant = "rag_research_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

